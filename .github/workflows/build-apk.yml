name: Build the M-Film Darkroom APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships a licensed SDK at $ANDROID_HOME, so only the pieces we
      # pin are installed here (setup-android@v3 asks for the retired 'tools' package).
      - name: SDK, NDK and CMake
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      # Every APK this project ships is signed with the one key below, so a new
      # build installs over the old one. Without it Gradle would sign with a
      # debug key made up on the spot, and Android refuses an update whose
      # signature changed -- the phone has to be wiped first.
      - name: Write the signing key
        env:
          KEY_B64: ${{ secrets.MFILM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MFILM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MFILM_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_B64}" ] || [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ]; then
            echo "::error::The signing secrets are missing (MFILM_KEYSTORE_BASE64, MFILM_STORE_PASSWORD, MFILM_KEY_ALIAS). Refusing to build an APK the phone can't update over."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/mfilm-signing.p12"
          (umask 077; printf '%s' "${KEY_B64}" | base64 -d > "$KEYSTORE")
          {
            echo "MFILM_KEYSTORE=$KEYSTORE"
            echo "MFILM_STORE_PASSWORD=${STORE_PASSWORD}"
            echo "MFILM_KEY_ALIAS=${KEY_ALIAS}"
          } >> "$GITHUB_ENV"

      - name: Build the signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check the signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          # one signer, and the same certificate every release: 25:5B:C4:...:2F:47:8D
          SIGNERS=$(grep -c 'certificate DN:' "$RUNNER_TEMP/certs.txt" || true)
          if [ "$SIGNERS" != "1" ]; then
            echo "::error::Expected exactly one signer, found $SIGNERS"
            exit 1
          fi
          grep -q 'certificate SHA-256 digest: 255bc4896034508b6813624a4ebe118e12897cfda91358b3db1410cd3b2f478d' "$RUNNER_TEMP/certs.txt" \
            || { echo "::error::The APK is not signed with the M-Film key."; exit 1; }

      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk M-Film-Darkroom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: M-Film-Darkroom
          path: M-Film-Darkroom.apk
          if-no-files-found: error
