name: Build the M-Film Darkroom APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships a licensed SDK at $ANDROID_HOME, so only the pieces we
      # pin are installed here (setup-android@v3 asks for the retired 'tools' package).
      - name: SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name it
        run: cp android/app/build/outputs/apk/debug/app-debug.apk M-Film-Darkroom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: M-Film-Darkroom
          path: M-Film-Darkroom.apk
          if-no-files-found: error
